# Запуск на ВМ: cp .env.example .env → заполнить → docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./var:/data            # база SQLite и загруженные файлы — бэкапить эту папку
    restart: unless-stopped
    expose: ["8000"]

  caddy:                       # HTTPS-сертификат Let's Encrypt получает сам, нужен только домен
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
