# Запуск на ВМ: cp .env.example .env → заполнить → docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      # база SQLite и загруженные файлы. Именованный том, а не ./var: папку ./var Docker создал бы
      # от root, и пользователь app в контейнере не смог бы в неё писать. Бэкап — см. README.
      - app_data:/data
    restart: unless-stopped
    expose: ["8000"]

  caddy:                       # HTTPS-сертификат Let's Encrypt получает сам, нужен только домен
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
